    - article [ref=e57]:
      - paragraph [ref=e58]: 【本報訊】農業農村部昨日舉行新聞發布會，通報全國秋糧收穫進展。截至本月中旬，全國秋糧已收穫八成以上，進度較往年提前約五日，豐收格局業已奠定。
      - paragraph [ref=e59]: 通報顯示，今年秋糧生產呈現面積穩、單產升、結構優三個特點。東北、黃淮海等主產區光熱條件總體適宜，病蟲害發生面積較上年減少，防災減災措施落實有力，為豐收爭得了主動。
      - paragraph [ref=e60]: 單產提升是本季豐收的關鍵。各地推廣密植、水肥一體化與機收減損技術，玉米、大豆平均單產均較上年提高。高標準農田建設持續推進，全年新建與改造任務可望如期完成。
      - paragraph [ref=e61]: 市場方面，新糧上市以來購銷兩旺，價格總體平穩。有關部門已部署收儲與運力調度，確保顆粒歸倉、農民售糧順暢。分析人士指，糧源充裕為下游加工與物價平穩提供支撐。
      - paragraph [ref=e62]: 專家提醒，秋冬種即將展開，各地宜趁墑情適時播種，加強田間管理，為來年夏糧生產打好基礎。本報將持續關注後續進展。
  - generic [ref=e63]:
    - article [ref=e64]:
      - paragraph [ref=e65]: 財經
      - heading "製造業景氣連續四月回升 穩增長政策效應顯現" [level=3] [ref=e66]
      - paragraph [ref=e67]: 國家統計局服務業調查中心昨日發布數據，九月製造業採購經理指數報五十點四，較上月上升零點三個百分點，連續第四個月位於擴張區間。生產指數與新訂單指數同步走強，裝備製造與高技術製造業領跑。
      - paragraph [ref=e68]: 分析人士認為，設備更新、消費品以舊換新等政策持續顯效，企業預期改善，補庫存意願回升。第四季度基建投資有望加快，全年經濟增長目標可期。
    - article [ref=e69]:
      - paragraph [ref=e70]: 科技
      - heading "新一代量子原型機問世 相干時間延長三倍" [level=3] [ref=e71]
      - paragraph [ref=e72]: 國內研究團隊昨日發布新一代超導量子計算原型機，其量子比特相干時間較上一代延長約三倍，糾錯能力顯著提升。相關成果已於國際學術期刊發表。
      - paragraph [ref=e73]: 據介紹，新原型機在製備、測控與封裝等環節均有改進，為後續規模化容錯量子計算奠定了工藝基礎。團隊表示，下一階段將聚焦比特規模擴展與系統軟件生態建設。
  - generic [ref=e74]:
    - generic [ref=e75]:
      - paragraph [ref=e76]: 副刊
      - heading "白露小記" [level=3] [ref=e77]
      - paragraph [ref=e78]: 白露既過，暑氣漸收。晨起推窗，草葉間已有細露，日光斜照，如碎銀鋪地。巷口賣菱角的老者依舊五更出攤，籃上覆布，揭開時白氣微起。
      - paragraph [ref=e79]: 江南的秋天，是從一盞早茶開始的。茶館裡評彈聲慢，說書人講到關目處，摺扇一收，滿座寂然。窗外運河水漲，烏篷船過，槳聲燈影，俱是舊時光景。
      - paragraph [ref=e80]: 節氣到了白露，夜涼如水。宜早臥，宜添衣，宜把夏天的事情慢慢收攏，釀成一罈米酒，留待冬至啟封。
