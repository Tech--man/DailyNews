    - article [ref=e31]:
      - heading "時速四百公里新型動車組下線" [level=3] [ref=e32]
      - figure "新型動車組昨日在青島下線。（本報資料照片）" [ref=e33]:
        - img "新型動車組列車頭的黑白資料照片" [ref=e34]
      - paragraph [ref=e36]: 我國自主研製的新型時速四百公里動車組昨日下線，將於明年投入商業運營。該車組採用永磁牽引與碳化矽變流技術，能耗較現行列車降低一成。
      - paragraph [ref=e37]: 據研製方介紹，新車組在車體減振、噪聲控制與智能化運維方面均有突破，車廂設可旋轉座椅與多功能區，兼顧長途與城際出行需求。
