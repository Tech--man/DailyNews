<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="秋收場景黑白插圖">
  <defs>
    <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.2" fill="#1C1A17"/>
    </pattern>
  </defs>

  <!-- 天空與地面 -->
  <rect width="800" height="560" fill="#d9d3c3"/>
  <rect y="316" width="800" height="16" fill="#8a8474"/>
  <rect y="332" width="800" height="228" fill="#b3ac99"/>

  <!-- 日輪 -->
  <circle cx="650" cy="96" r="46" fill="#efe9d9" stroke="#8c8578" stroke-width="2"/>

  <!-- 飛鳥 -->
  <path d="M497 130 q7 -8 14 0 q7 -8 14 0" fill="none" stroke="#3a362f" stroke-width="2"/>
  <path d="M540 156 q5 -6 10 0 q5 -6 10 0" fill="none" stroke="#3a362f" stroke-width="2"/>

  <!-- 田壟 -->
  <g stroke="#8c8578" stroke-width="2" opacity="0.55">
    <line x1="-20" y1="372" x2="820" y2="384"/>
    <line x1="-20" y1="408" x2="820" y2="424"/>
    <line x1="-20" y1="448" x2="820" y2="468"/>
    <line x1="-20" y1="492" x2="820" y2="516"/>
    <line x1="-20" y1="538" x2="820" y2="564"/>
  </g>

  <!-- 聯合收割機剪影 -->
  <g fill="#3a362f">
    <rect x="182" y="212" width="188" height="78"/>
    <rect x="300" y="168" width="58" height="56"/>
    <rect x="308" y="178" width="42" height="30" fill="#d9d3c3"/>
    <rect x="140" y="248" width="44" height="66"/>
    <g stroke="#3a362f" stroke-width="4">
      <line x1="146" y1="258" x2="180" y2="264"/>
      <line x1="146" y1="274" x2="180" y2="280"/>
      <line x1="146" y1="290" x2="180" y2="296"/>
    </g>
    <rect x="370" y="196" width="70" height="8"/>
  </g>
  <g fill="#3a362f">
    <circle cx="228" cy="304" r="28"/>
    <circle cx="316" cy="308" r="21"/>
    <circle cx="372" cy="308" r="21"/>
  </g>
  <g fill="#b3ac99">
    <circle cx="228" cy="304" r="9"/>
    <circle cx="316" cy="308" r="7"/>
    <circle cx="372" cy="308" r="7"/>
  </g>

  <!-- 半調網點 -->
  <rect width="800" height="560" fill="url(#halftone)" opacity="0.16"/>
</svg>
